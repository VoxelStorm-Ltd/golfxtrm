name: Build Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        # Pushes must still produce artifacts for deployment/release jobs.
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release","push"]'

  build-win-debug:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build_win/
        key: win-debug-${{ hashFiles('CMakeLists.txt', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          win-debug-
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost1.83-all-dev mingw-w64-i686-dev gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686
    - name: Build
      run: |
        cmake -S . -B build_win -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ -DCMAKE_BUILD_TYPE=Debug
        cmake --build build_win --parallel "$(nproc)"

  build-win-release:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: build_win_rel/
        key: win-release-${{ hashFiles('CMakeLists.txt', '**/*.cpp', '**/*.h') }}
        restore-keys: |
          win-release-
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost1.83-all-dev mingw-w64-i686-dev gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686
    - name: Build
      run: |
        cmake -S . -B build_win_rel -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ -DCMAKE_BUILD_TYPE=Release
        cmake --build build_win_rel --parallel "$(nproc)"
    - name: Package release
      run: |
        cmake -E make_directory package/GolfXTRM
        cmake -E make_directory package/GolfXTRM/assets
        cmake -E copy bin/Win32_Release/GolfXTRM/GolfXTRM.exe package/GolfXTRM/GolfXTRM.exe
        cmake -E copy irrKlang.dll package/GolfXTRM/irrKlang.dll
        cmake -E copy *.ogg package/GolfXTRM
        cmake -E copy "GolfXTRM splash screen.png" package/GolfXTRM
        cmake -E copy assets/raptor.obj package/GolfXTRM/assets/raptor.obj
        cmake -E chdir package cmake -E tar cf ../GolfXTRM-windows.zip --format=zip GolfXTRM
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-GolfXTRM
        path: GolfXTRM-windows.zip
        if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-win-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-GolfXTRM
        path: release
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        release_tag="release-${GITHUB_SHA::7}"
        if gh release view "$release_tag" >/dev/null 2>&1; then
          echo "Release $release_tag already exists"
        else
          gh release create "$release_tag" \
            release/GolfXTRM-windows.zip \
            --target "$GITHUB_SHA" \
            --title "GolfXTRM ${GITHUB_SHA::7}" \
            --generate-notes
        fi
